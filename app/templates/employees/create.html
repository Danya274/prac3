{% extends "base.html" %}

{% block title %}Create Employee{% endblock %}

{% block content %}
    <h1>Create Employee</h1>
    
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    
    <form method="post">
        <div>
            <label>Name:</label>
            <input type="text" name="name" required>
        </div>
        
        <div>
            <label>Date of Birth:</label>
            <input type="text" name="date_of_birth" placeholder="1990-01-15" required>
        </div>
        
        <div>
            <label>Status:</label>
            <input type="text" name="status" placeholder="active, inactive" required>
        </div>
        
        <div>
            <label>Department:</label>
            <select name="department_id" required>
                <option value="">Select department</option>
                {% for department in departments %}
                <option value="{{ department.id }}">{{ department.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label>Position:</label>
            <select name="position_id" required>
                <option value="">Select position</option>
                {% for position in positions %}
                <option value="{{ position.id }}">{{ position.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div>
            <label>Rate:</label>
            <input type="text" name="rate" placeholder="0.5, 0.75, 1.0" required>
        </div>
        
        <div>
            <label>Salary:</label>
            <input type="text" name="salary" required>
        </div>
        
        <div>
            <label>Employment Date:</label>
            <input type="text" name="date_of_employment" placeholder="2024-01-15" required>
        </div>
        
        <div>
            <label>Login:</label>
            <input type="text" name="login" required>
        </div>
        
        <div>
            <label>Password:</label>
            <input type="password" name="password" required>
        </div>
        
        <br>
        <div>
            <button type="submit" class="btn-create">Create</button>
            <a href="/pages/employee_list" class="btn-cancel">Cancel</a>
        </div>
    </form>
{% endblock %}
